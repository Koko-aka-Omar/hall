services:
  - type: web
    name: hall-sound-attendance
    runtime: node
    plan: free
    rootDir: sound-attendance
    branch: main
    buildCommand: node --version
    startCommand: node server/server.js
    healthCheckPath: /api/public
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LECTURER_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "0"
